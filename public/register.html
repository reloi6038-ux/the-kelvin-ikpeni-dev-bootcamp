<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — The Kelvin Ikpeni Dev Bootcamp</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <span class="nav-logo-mark">K</span>
        <span>The Kelvin Ikpeni Dev Bootcamp</span>
      </a>
      <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <ul class="nav-links" data-nav-links>
        <li><a href="/">Home</a></li>
        <li><a href="/courses.html">Courses</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
      <div class="nav-cta">
        <a href="/login.html" class="btn btn-secondary">Log in</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: var(--sp-10);">
      <div class="container" style="max-width: 480px;">
        <div style="text-align:center; margin-bottom: var(--sp-8);">
          <h1>Create your account</h1>
          <p style="color: var(--text-muted);">Start learning full-stack development today.</p>
        </div>

        <form class="form" id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name">Full name</label>
            <input type="text" id="reg-name" name="name" required minlength="2" maxlength="80" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="reg-email">Email address</label>
            <input type="email" id="reg-email" name="email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" required minlength="8" autocomplete="new-password" />
            <small style="color: var(--text-dim); font-size: 0.85rem;">
              At least 8 characters, including one letter and one number.
            </small>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="reg-submit">
            Create account
          </button>
          <p id="reg-error" role="alert" style="color: var(--danger); margin-top: var(--sp-4); min-height: 1.2em;"></p>
          <p style="text-align:center; margin-top: var(--sp-4); color: var(--text-muted);">
            Already have an account? <a href="/login.html">Log in</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async function () {
      const form = document.getElementById("register-form");
      const errEl = document.getElementById("reg-error");
      const submitBtn = document.getElementById("reg-submit");

      // Pre-fetch CSRF token
      try { await fetch("/api/auth/csrf"); } catch {}

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEl.textContent = "";

        // Use FormData to guarantee we capture autofilled values
        const data = new FormData(form);
        const name = (data.get("name") || "").toString().trim();
        const email = (data.get("email") || "").toString().trim();
        const password = (data.get("password") || "").toString();

        if (!name || name.length < 2) {
          errEl.textContent = "Please enter your full name.";
          return;
        }
        if (!email) {
          errEl.textContent = "Please enter your email address.";
          return;
        }
        if (!password || password.length < 8) {
          errEl.textContent = "Password must be at least 8 characters.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          await auth.register({ name, email, password });
          window.location.href = "/dashboard.html";
        } catch (err) {
          errEl.textContent = err.message || "Registration failed.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
        }
      });
    })();
  </script>
</body>
</html>
