<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Kelvin Ikpeni Dev Bootcamp</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <span class="nav-logo-mark">K</span>
        <span>The Kelvin Ikpeni Dev Bootcamp</span>
      </a>
      <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <ul class="nav-links" data-nav-links>
        <li><a href="/">Home</a></li>
        <li><a href="/courses.html">Courses</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
      <div class="nav-cta">
        <a href="/dashboard.html" class="btn btn-primary">My Dashboard</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Get in Touch</h1>
        <p>Questions about the curriculum, learning path, or the platform? Send us a message.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form class="form" id="contact-form">
          <div class="form-group">
            <label for="contact-name">Your name</label>
            <input type="text" id="contact-name" name="name" required minlength="2" maxlength="80" />
          </div>
          <div class="form-group">
            <label for="contact-email">Email address</label>
            <input type="email" id="contact-email" name="email" required />
          </div>
          <div class="form-group">
            <label for="contact-subject">Subject</label>
            <input type="text" id="contact-subject" name="subject" required maxlength="120" />
          </div>
          <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" required minlength="10" maxlength="2000"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
          <p id="contact-status" style="margin-top: var(--sp-4); color: var(--text-muted); font-size: 0.9rem;"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; <span data-current-year></span> The Kelvin Ikpeni Dev Bootcamp.</span>
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const status = document.getElementById("contact-status");
      status.textContent = "✅ Thank you! Contact submissions will be connected to the backend in a later phase.";
    });
  </script>
</body>
</html>
