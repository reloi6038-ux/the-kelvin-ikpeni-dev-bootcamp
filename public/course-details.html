<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course — The Kelvin Ikpeni Dev Bootcamp</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <span class="nav-logo-mark">K</span>
        <span>The Kelvin Ikpeni Dev Bootcamp</span>
      </a>
      <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <ul class="nav-links" data-nav-links>
        <li><a href="/">Home</a></li>
        <li><a href="/courses.html">Courses</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
        <li><a href="/dashboard.html">Dashboard</a></li>
      </ul>
      <div class="nav-cta">
        <a href="/dashboard.html" class="btn btn-primary">My Dashboard</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 id="course-title">Loading course...</h1>
        <p id="course-description"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="course-detail-layout">
          
          <div class="course-detail-main" id="course-modules">
            <!-- Filled by JS -->
          </div>

          <aside class="course-sidebar">
            <h3>Course details</h3>
            <ul class="course-sidebar-list">
              <li><strong>Level</strong> <span id="sidebar-level">—</span></li>
              <li><strong>Duration</strong> <span id="sidebar-hours">—</span></li>
              <li><strong>Modules</strong> <span id="sidebar-modules">—</span></li>
              <li><strong>Lessons</strong> <span id="sidebar-lessons">—</span></li>
              <li><strong>Your progress</strong> <span id="sidebar-progress">—</span></li>
            </ul>
            <button id="enroll-btn" class="btn btn-primary mt-6" style="width:100%;" disabled>
              Checking enrollment...
            </button>
            <p id="enroll-status" style="margin-top: var(--sp-3); color: var(--text-muted); font-size: 0.9rem; text-align:center;"></p>
            <div id="cert-area" style="margin-top: var(--sp-4);"></div>
          </aside>

        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; <span data-current-year></span> The Kelvin Ikpeni Dev Bootcamp.</span>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      
      const modulesEl = document.getElementById("course-modules");
      const titleEl = document.getElementById("course-title");
      const descEl = document.getElementById("course-description");
      const enrollBtn = document.getElementById("enroll-btn");
      const enrollStatus = document.getElementById("enroll-status");
      const progressEl = document.getElementById("sidebar-progress");
      const certArea = document.getElementById("cert-area");

      if (!slug) {
        titleEl.textContent = "Course not specified";
        descEl.textContent = "Return to the courses page and select a course.";
        return;
      }

      // 1. Fetch CSRF token FIRST
      let csrfToken = "";
      try {
        const res = await fetch("/api/auth/csrf");
        const data = await res.json();
        csrfToken = data.csrfToken;
      } catch (e) {}

      let courseId = null;
      let courseTitle = "";
      let allModules = []; // Store modules to find the first lesson later

      // 2. Load Course Content
      try {
        const data = await apiRequest(`/api/courses/${encodeURIComponent(slug)}`);
        const course = data.course;
        allModules = data.modules || [];
        
        courseId = course._id;
        courseTitle = course.title;

        document.title = `${course.title} — The Kelvin Ikpeni Dev Bootcamp`;
        titleEl.textContent = course.title;
        descEl.textContent = course.description;

        document.getElementById("sidebar-level").textContent = course.level;
        document.getElementById("sidebar-hours").textContent = `${course.estimatedHours} hours`;
        document.getElementById("sidebar-modules").textContent = allModules.length;
        
        const totalLessons = allModules.reduce((sum, m) => sum + (m.lessons?.length || 0), 0);
        document.getElementById("sidebar-lessons").textContent = totalLessons;

        if (allModules.length === 0) {
          modulesEl.innerHTML = `<div class="state-message">No modules yet — check back soon.</div>`;
        } else {
          modulesEl.innerHTML = allModules
            .map((mod) => {
              const lessons = (mod.lessons || [])
                .map(
                  (l) => `
                    <li class="lesson-item">
                      <a href="/lesson?course=${encodeURIComponent(slug)}&lesson=${encodeURIComponent(l.slug)}"
                         style="display:flex; justify-content:space-between; align-items:center; width:100%; text-decoration:none; color:inherit; gap: var(--sp-3);">
                        <span class="lesson-title">${escapeHtml(l.title)}</span>
                        <span class="lesson-meta">${l.estimatedMinutes} min →</span>
                      </a>
                    </li>`
                )
                .join("");
                
              return `
                <article class="module">
                  <div class="module-header">
                    <h3>${escapeHtml(mod.title)}</h3>
                    <span class="module-order">${mod.order}</span>
                  </div>
                  ${mod.description ? `<p class="module-desc">${escapeHtml(mod.description)}</p>` : ""}
                  <ul class="lesson-list">${lessons}</ul>
                </article>`;
            })
            .join("");
        }
      } catch (err) {
        titleEl.textContent = "Course unavailable";
        descEl.textContent = err.message;
        modulesEl.innerHTML = `<div class="state-message error">${escapeHtml(err.message)}</div>`;
        return;
      }

      let isEnrolled = false;

      // 3. Check Enrollment Status
      try {
        const list = await apiRequest("/api/enrollments");
        const existing = list.enrollments.find((e) => e.course.slug === slug);

        if (existing) {
          isEnrolled = true;
          enrollBtn.textContent = "Continue learning";
          enrollBtn.disabled = false;
          
          // FIX: Find the first lesson and go directly to it
          let firstLessonSlug = null;
          if (allModules.length > 0 && allModules[0].lessons && allModules[0].lessons.length > 0) {
            firstLessonSlug = allModules[0].lessons[0].slug;
          }

          enrollBtn.addEventListener("click", () => {
            if (firstLessonSlug) {
              window.location.href = `/lesson?course=${encodeURIComponent(slug)}&lesson=${encodeURIComponent(firstLessonSlug)}`;
            } else {
              window.location.href = "/dashboard.html";
            }
          });

          progressEl.textContent = `${existing.progress.percent}%`;
          enrollStatus.textContent = `You're enrolled — ${existing.progress.completed}/${existing.progress.total} lessons complete.`;
        } else {
          enrollBtn.textContent = "Enroll Now";
          enrollBtn.disabled = false;
          enrollStatus.textContent = "Ready to start learning?";
          
          enrollBtn.onclick = async () => {
            enrollBtn.disabled = true;
            enrollBtn.textContent = "Enrolling...";
            try {
              const response = await fetch("/api/enrollments", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-CSRF-Token": csrfToken
                },
                body: JSON.stringify({ slug: slug })
              });

              const data = await response.json();
              if (!response.ok) throw new Error(data.message || "Enrollment failed");

              // If enrolling fresh, reload the page to show the "Continue learning" state
              window.location.reload();
            } catch (enrollErr) {
              enrollStatus.textContent = enrollErr.message;
              enrollBtn.disabled = false;
              enrollBtn.textContent = "Enroll Now";
            }
          };
        }
      } catch (err) {
        enrollBtn.textContent = "Enroll Now";
        enrollBtn.disabled = false;
        enrollStatus.textContent = "Could not check enrollment status.";
      }

      // 4. Certificate Eligibility
      if (isEnrolled) {
        try {
          const certsRes = await apiRequest("/api/certificates");
          const existingCert = (certsRes.certificates || []).find(
            (c) => c.courseId === courseId || c.courseTitle === courseTitle
          );

          if (existingCert) {
            certArea.innerHTML = `
              <a href="/api/certificates/${encodeURIComponent(existingCert.certificateId)}/download" class="btn btn-primary" style="width:100%;">
                🎓 Download Certificate
              </a>
              <a href="/verify-certificate.html?id=${encodeURIComponent(existingCert.certificateId)}" class="btn btn-secondary mt-2" style="width:100%;">
                Verify Certificate
              </a>
            `;
          } else {
            certArea.innerHTML = `
              <button id="claim-cert-btn" class="btn btn-secondary" style="width:100%;">
                🎓 Claim Certificate
              </button>
              <p id="claim-cert-status" style="margin-top: var(--sp-2); font-size:0.85rem; color: var(--text-muted); text-align:center;"></p>
            `;

            document.getElementById("claim-cert-btn").addEventListener("click", async (e) => {
              const btn = e.target;
              const status = document.getElementById("claim-cert-status");
              btn.disabled = true;
              status.textContent = "Checking eligibility...";
              try {
                const res = await apiRequest("/api/certificates/issue", {
                  method: "POST",
                  body: { courseId }
                });
                status.textContent = "✅ Issued! Starting download...";
                setTimeout(() => {
                  window.location.href = `/api/certificates/${encodeURIComponent(res.certificate.certificateId)}/download`;
                }, 800);
              } catch (err) {
                status.textContent = "❌ " + (err.message || "Not eligible yet.");
                btn.disabled = false;
              }
            });
          }
        } catch (err) {
          certArea.innerHTML = "";
        }
      }
    })();
  </script>
</body>
</html>
