<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — The Kelvin Ikpeni Dev Bootcamp</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <span class="nav-logo-mark">K</span>
        <span>The Kelvin Ikpeni Dev Bootcamp</span>
      </a>
      <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <ul class="nav-links" data-nav-links>
        <li><a href="/">Home</a></li>
        <li><a href="/courses.html">Courses</a></li>
        <li><a href="/dashboard.html">Dashboard</a></li>
        <li><a href="/certificates.html">Certificates</a></li>
      </ul>
      <div class="nav-cta">
        <a href="/dashboard.html" class="btn btn-primary">My Dashboard</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 id="welcome-heading">Welcome...</h1>
        <p>Track your progress and continue learning.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="dashboard-error" class="state-message error" style="display:none;"></div>

        <div id="dashboard-content" style="display:none;">
          
          <!-- Profile -->
          <h2>Your Profile</h2>
          <div class="course-card" style="max-width: 640px; margin-bottom: var(--sp-8); padding: var(--sp-6);">
            <div style="display:flex; gap: var(--sp-3); align-items:flex-end; margin-bottom: var(--sp-4);">
              <div style="flex:1;">
                <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Display Name</label>
                <input type="text" id="profile-name" style="width: 100%; padding: 10px; margin-top: 4px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: white;">
              </div>
              <button id="save-name-btn" class="btn btn-primary">Save</button>
            </div>
            <p id="name-status" style="font-size: 0.85rem; color: var(--success); min-height: 1.2em; margin: 0 0 var(--sp-4);"></p>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4);">
              <div><strong>Email:</strong> <br><span id="profile-email" style="color:var(--text-muted);">—</span></div>
              <div><strong>Role:</strong> <br><span id="profile-role" style="color:var(--text-muted);">—</span></div>
              <div><strong>Joined:</strong> <br><span id="profile-joined" style="color:var(--text-muted);">—</span></div>
            </div>
          </div>

          <!-- Enrolled courses -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--sp-6);">
            <h2 style="margin:0;">Your Courses</h2>
            <a href="/courses.html" class="btn btn-secondary">+ Browse Catalog</a>
          </div>

          <div id="enrolled-grid" class="courses-grid">
            <!-- Filled by JS -->
          </div>

          <!-- Certificates -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin: var(--sp-10) 0 var(--sp-6);">
            <h2 style="margin:0;">Your Certificates</h2>
            <a href="/certificates.html" class="btn btn-secondary">View all →</a>
          </div>
          <div id="certs-preview" class="courses-grid">
            <!-- Filled by JS -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/enroll.js"></script>
  <script>
    (async function () {
      const errEl = document.getElementById("dashboard-error");
      const content = document.getElementById("dashboard-content");
      const welcome = document.getElementById("welcome-heading");
      const nameInput = document.getElementById("profile-name");
      const saveBtn = document.getElementById("save-name-btn");
      const nameStatus = document.getElementById("name-status");

      try {
        const user = await auth.requireAuthOrRedirect();
        if (!user) return;

        const displayName = user.name === "Guest Student" || !user.name ? "" : user.name;
        welcome.textContent = displayName ? `Welcome, ${displayName}!` : "Welcome to your Dashboard!";
        nameInput.value = displayName;

        document.getElementById("profile-email").textContent = user.email || "—";
        document.getElementById("profile-role").textContent = user.role || "—";
        document.getElementById("profile-joined").textContent = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : "—";

        saveBtn.addEventListener("click", async () => {
          const newName = nameInput.value.trim();
          if (!newName) return (nameStatus.textContent = "Please enter a name.");
          
          saveBtn.disabled = true;
          saveBtn.textContent = "Saving...";
          nameStatus.textContent = "";
          
          try {
            const csrfRes = await fetch("/api/auth/csrf");
            const csrfData = await csrfRes.json();
            const response = await fetch("/api/auth/update-profile", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfData.csrfToken },
              body: JSON.stringify({ name: newName })
            });
            if (response.ok) {
              nameStatus.style.color = "var(--success)";
              nameStatus.textContent = "✅ Name saved!";
              welcome.textContent = `Welcome, ${newName}!`;
              setTimeout(() => nameStatus.textContent = "", 3000);
            } else {
              throw new Error("Failed to save name.");
            }
          } catch (e) {
            nameStatus.style.color = "var(--danger)";
            nameStatus.textContent = "❌ " + e.message;
          } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "Save";
          }
        });

        // Load enrolled courses
        const grid = document.getElementById("enrolled-grid");
        const list = await apiRequest("/api/enrollments");

        if (!list.enrollments || list.enrollments.length === 0) {
          grid.innerHTML = `<div class="state-message" style="grid-column: 1 / -1;">You haven't enrolled in any courses yet.<br><a href="/courses.html" class="btn btn-primary mt-4">Browse courses →</a></div>`;
        } else {
          // FIX: Changed href to /course-details?slug= (clean URL)
          grid.innerHTML = list.enrollments.map((enr) => {
            const p = enr.progress;
            return `
              <a class="course-card" href="/course-details?slug=${encodeURIComponent(enr.course.slug)}">
                <span class="course-card-level ${escapeHtml(enr.course.level)}">${escapeHtml(enr.course.level)}</span>
                <h3>${escapeHtml(enr.course.title)}</h3>
                <p class="course-card-desc">${escapeHtml(enr.course.description)}</p>
                <div style="margin-top:auto;">
                  <div style="display:flex; justify-content:space-between; font-size:0.85rem; color: var(--text-muted); margin-bottom: var(--sp-2);">
                    <span>Progress</span>
                    <span>${p.completed} / ${p.total} lessons</span>
                  </div>
                  <div style="background: var(--bg-elevated); border-radius: var(--r-full); height: 8px; overflow: hidden;">
                    <div style="height:100%; width:${p.percent}%; background: linear-gradient(90deg, var(--primary), #7c5cff);"></div>
                  </div>
                  <div style="margin-top: var(--sp-2); font-weight:700; color: var(--primary);">${p.percent}% complete</div>
                </div>
              </a>`;
          }).join("");
        }

        // Load certificates
        try {
          const certs = await apiRequest("/api/certificates");
          const preview = document.getElementById("certs-preview");
          if (!certs.certificates || certs.certificates.length === 0) {
            preview.innerHTML = `<div class="state-message" style="grid-column: 1 / -1;">No certificates yet — complete a course and pass its final exam to earn one.</div>`;
          } else {
            preview.innerHTML = certs.certificates.slice(0, 3).map((c) => `
              <div class="course-card">
                <div class="course-card-icon" aria-hidden="true">🎓</div>
                <h3>${escapeHtml(c.courseTitle)}</h3>
                <p class="course-card-desc">
                  <strong>${c.type === "accomplishment" ? "Statement of Accomplishment" : "Certificate of Completion"}</strong><br>
                  Awarded to <strong>${escapeHtml(c.studentName)}</strong><br>
                  Issued: ${new Date(c.issuedAt).toLocaleDateString()}<br>
                  ${c.revoked ? `<span style="color: var(--danger);">⚠ Revoked</span>` : `<span style="color: var(--success);">✓ Valid</span>`}
                </p>
                <p style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--primary); margin-bottom: var(--sp-3);">${escapeHtml(c.certificateId)}</p>
                <div style="display:flex; gap: var(--sp-2); flex-wrap:wrap; margin-top:auto;">
                  ${c.revoked ? `<button class="btn btn-secondary" disabled>Unavailable</button>` : `<a class="btn btn-primary" href="/api/certificates/${encodeURIComponent(c.certificateId)}/download">⬇ PDF</a>`}
                  <a class="btn btn-secondary" href="/verify-certificate.html?id=${encodeURIComponent(c.certificateId)}">Verify</a>
                </div>
              </div>
            `).join("");
          }
        } catch (e) {}

        content.style.display = "block";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
      }
    })();
  </script>
</body>
</html>
