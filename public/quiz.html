<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — The Kelvin Ikpeni Dev Bootcamp</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/editor.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="nav-logo">
        <span class="nav-logo-mark">K</span>
        <span>The Kelvin Ikpeni Dev Bootcamp</span>
      </a>
      <ul class="nav-links" data-nav-links>
        <li><a href="/">Home</a></li>
        <li><a href="/courses.html">Courses</a></li>
        <li><a href="/dashboard.html">Dashboard</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: var(--sp-8);">
      <div class="container" style="max-width: 820px;">
        <div id="quiz-error" class="state-message error" style="display:none;"></div>

        <div id="quiz-container" style="display:none;">
          <header style="margin-bottom: var(--sp-6);">
            <h1 id="quiz-title">Loading...</h1>
            <p id="quiz-description" style="color: var(--text-muted);"></p>
            <div style="display:flex; gap: var(--sp-4); color: var(--text-muted); font-size: 0.9rem;">
              <span id="quiz-question-count"></span>
              <span id="quiz-passing-score"></span>
            </div>
          </header>

          <form id="quiz-form" style="display:flex; flex-direction:column; gap: var(--sp-5);">
            <div id="quiz-questions"></div>

            <button type="submit" class="btn btn-primary btn-lg" id="quiz-submit">
              Submit Quiz
            </button>
          </form>

          <div id="quiz-results" style="display:none; margin-top: var(--sp-6);"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/quizzes.js"></script>
</body>
</html>
